[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rq-agent"
version = "0.1.1"
description = "Local LLM developer/PM assistant (Azure DevOps task breakdown, codebase-aware estimation, Minutes of Meeting) backed by Ollama."
requires-python = ">=3.9"
dependencies = [
    "prompt_toolkit>=3.0",
]

[project.scripts]
rq-agent = "rq_agent.task_breakdown_chat:main"

[tool.setuptools]
packages = ["rq_agent"]
