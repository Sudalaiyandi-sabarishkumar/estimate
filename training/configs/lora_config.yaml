model: "mlx-community/Qwen2.5-Coder-3B-Instruct-4bit"
train: true
fine_tune_type: lora
data: "training/data/lora"
seed: 0
num_layers: 8
batch_size: 1
grad_accumulation_steps: 4
iters: 400
learning_rate: 1e-5
val_batches: -1
steps_per_report: 5
steps_per_eval: 50
save_every: 25
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
adapter_path: "training/adapters"
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 20.0
  dropout: 0.05
